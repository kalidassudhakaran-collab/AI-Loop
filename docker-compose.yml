services:
  postgres:
    image: postgres:16
    container_name: loop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: loop
      POSTGRES_USER: loop_user
      POSTGRES_PASSWORD: loop_password
    ports:
      - "5432:5432"
    volumes:
      - loop_pgdata:/var/lib/postgresql/data

volumes:
  loop_pgdata: